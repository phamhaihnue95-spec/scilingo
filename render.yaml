services:
  - type: web
    name: scilingo-khtn-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scilingo-khtn-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://khtn.scilingo-edu.workers.dev,http://localhost:5173
      - key: PLATFORM_ADMIN_EMAIL
        value: phamhaihnue95@gmail.com
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false

databases:
  - name: scilingo-khtn-db
    plan: free
    databaseName: scilingo_khtn8
    user: scilingo
