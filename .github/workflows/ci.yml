name: SciLingo KHTN 8 CI (AI-DLC Gates)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gate1-inception:
    name: Gate 1 — Inception Data & Spec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_inception.py

  backend-ci:
    name: Gate 2 — Backend Lint & Pytest (FastAPI + Alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check app tests
      - run: uv run pytest -v

  frontend-ci:
    name: Gate 2 — Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
