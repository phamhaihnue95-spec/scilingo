services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scilingo_khtn_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scilingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scilingo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-scilingo_khtn8}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scilingo} -d ${POSTGRES_DB:-scilingo_khtn8}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
